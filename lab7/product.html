<!DOCTYPE html>
<html>
<head>
<title>Product Management Page</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Product Management </h2>

<table>

<tr>
<th>Product</th>
<th>Unit Price</th>
<th>Quantity</th>
<th>Total Price</th>
</tr>

<tr>
<td>Keyboard</td>
<td>500</td>
<td><input type="number" id="q1" value="0" min="0"></td>
<td><input type="text" id="t1" value="0" readonly></td>
</tr>

<tr>
<td>Mouse</td>
<td>300</td>
<td><input type="number" id="q2" value="0" min="0"></td>
<td><input type="text" id="t2" value="0" readonly></td>
</tr>

<tr>
<td>Monitor</td>
<td>1000</td>
<td><input type="number" id="q3" value="0" min="0"></td>
<td><input type="text" id="t3" value="0" readonly></td>
</tr>

</table>

<h3>Grand Total: <span id="grandTotal">0</span></h3>

</div>

<script src="script.js"></script>

</body>
</html>
